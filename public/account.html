<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My account • Codeful Studios</title><style>body{font-family:system-ui;margin:0;background:#f4f3ff;color:#231b52}header{background:#241b63;padding:20px;color:white}header a{color:white;text-decoration:none}main{max-width:920px;margin:35px auto;padding:20px}.panel{background:white;border-radius:15px;padding:24px;margin-bottom:17px;box-shadow:0 4px 30px #241b6312}input,button{padding:11px;margin:5px 0;border-radius:8px;font:inherit}input{display:block;border:1px solid #cbc9e4;width:min(350px,92%)}button{background:#644ae2;color:white;border:0;cursor:pointer}.hidden{display:none}table{border-collapse:collapse;width:100%}td,th{padding:10px;text-align:left;border-bottom:1px solid #eee}</style></head><body><header><a href="/">◈ Codeful Studios</a> / My account</header><main><div id="guest"><div class="panel"><h2>Sign in</h2><form id="login"><input type="email" name="email" placeholder="Email" required><input name="password" type="password" placeholder="Password" required><button>Sign in</button></form></div><div class="panel"><h2>Create your account</h2><form id="register"><input name="name" placeholder="Your name" required><input type="email" name="email" placeholder="Email" required><input name="password" type="password" minlength="12" placeholder="Password (12+ characters)" required><button>Register</button></form></div></div><div id="member" class="hidden"><div class="panel"><h2 id="welcome">My account</h2><button id="logout">Log out</button></div><div class="panel"><h2>Purchase history</h2><div id="orders"></div></div><div class="panel"><h2>Licences</h2><div id="licences"></div></div><div class="panel"><h2>Downloads</h2><div id="downloads"></div><p>Downloads become available after secure storage and release approvals are configured.</p></div></div><p id="status" role="status"></p></main><script src="/account.js"></script></body></html>
